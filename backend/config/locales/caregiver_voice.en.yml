# What a caregiver hears on the call that confirms their own number for
# escalation calls (when somebody they look after misses an important
# reminder). Kept out of voice.*, which is the care receiver's script and must
# exist in every spoken language (spec/requests/spoken_language_spec.rb):
# caregivers have no spoken-language setting, so this is English only and the
# webhook asks for it in :en explicitly.
en:
  caregiver_voice:
    escalation_consent:
      request: >-
        Hello. This is Remindly. You asked us to call to confirm this number.
        If someone you look after misses an important reminder,
        we can phone you here so you can check on them.
        If you would like these calls, press 1 now.
        If you would rather not, press 9 and we will not call you about missed reminders.
      consented: >-
        Thank you. You are all set.
        We will only call you here when an important reminder is missed.
        You can press 9 on any of those calls to stop them.
      opted_out: >-
        Thank you. We will not call you about missed reminders.
        You can turn them back on from your profile.
    # The escalation call itself: the care receiver did not answer any of the
    # calls for a time-critical reminder. It names the person and the time and
    # never the reminder, so a voicemail that hears it learns no more than that
    # Remindly rang about them.
    escalation:
      request: >-
        Hello. This is Remindly, calling about %{name}.
        %{name} has not answered our calls about an important reminder that was due at %{time}.
        If you will check on %{name}, press 1.
        To pass this to the next person on the list, press 2.
        To stop these calls to you, press 9.
      accepted: >-
        Thank you. We will let the others know you are checking on %{name}.
      passed: >-
        Thank you. We will try the next person on the list, if there is one.
      opted_out: >-
        Thank you. We will not call you about missed reminders again.
        You can turn these calls back on from your profile.
