# Spanish call script. See config/locales/voice.en.yml for the constraints each
# line is written against — they are requirements, not preferences.
#
# NOT YET REVIEWED BY A NATIVE SPEAKER. This is a first pass and must be read by
# one before it reaches production. A machine translation of an anti-scam script
# is exactly how you produce something that sounds like a scam: the register has
# to stay calm and institutional, "usted" throughout rather than "tú", and
# Remindly must keep its place in the opening breath.
es:
  voice:
    announcement: >-
      Hola %{name}. Le habla Remindly, con su recordatorio.
      %{task}.
      Pulse 1 si ya lo ha hecho.
      Pulse 2 para que le recordemos de nuevo en %{minutes} minutos.
      Pulse 9 para dejar de recibir estas llamadas.
    consent:
      asked_by: "%{arranger} nos ha pedido"
      asked_generic: "Se nos ha pedido"
      request: >-
        Hola. Le habla Remindly, llamamos de parte de %{name}.
        %{asked} que le telefoneemos con recordatorios —
        por ejemplo, cuando sea la hora de tomar sus pastillas.
        Nunca le pediremos datos personales. Lo único que tendrá que hacer es pulsar una tecla.
        Si desea recibir estos recordatorios, pulse 1 ahora.
        Si prefiere que no, pulse 9 y no volveremos a llamar.
