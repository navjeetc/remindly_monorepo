# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  
  prune_analytics:
    class: PruneAnalyticsJob
    queue: default
    schedule: every day at 3am

  # Every schedule in this file is UTC — config.time_zone is left at its default
  # in config/application.rb, so Time.zone is UTC in production. That is not
  # obvious when writing "8am", and it mattered here: this job emails a caregiver
  # to say nobody is scheduled to look after their parent on an upcoming day, and
  # at 8am UTC it arrived at 4am Eastern and 1am Pacific — buried under overnight
  # mail by the time anyone was awake to act on it.
  #
  # 12:00 UTC is 8am Eastern in summer and 7am in winter, which is what "8am" was
  # reaching for. A fixed UTC hour cannot be right for every recipient; if
  # caregivers ever span more timezones than they do now, the answer is to run
  # this hourly and mail each one at 8am in their own tz, which users already
  # carry on `tz`.
  check_coverage_gaps:
    class: CheckCoverageGapsJob
    queue: default
    schedule: "0 12 * * *"

  # Hourly, and it has to be *ahead* of the times it is creating.
  #
  # Recurrence.expand back-fills the most recent past slot of the day, and both
  # the call scheduler and the delivery job refuse to telephone about a row
  # written after the time it names -- correctly, since nothing came due. So a
  # sweep that ran after a reminder's hour would materialise a row that can never
  # ring. An hourly run against expand's 24-hour horizon materialises everything
  # at least an hour early, with twenty-three hours of slack.
  #
  # Hourly rather than daily so a single failed run does not take a whole day's
  # reminders with it. Repeated runs cost a query and change nothing:
  # find_or_create_by finds the row it would have made.
  expand_reminders:
    class: ExpandRemindersJob
    queue: default
    schedule: every hour

  mark_missed_occurrences:
    class: MarkMissedOccurrencesJob
    queue: default
    schedule: every 15 minutes

  # Safe to leave scheduled while the feature is off: the job returns
  # immediately unless FeatureFlag.enabled?(:phone_call_reminders), which is
  # false unless ENABLE_PHONE_CALL_REMINDERS=true is set in the deploy
  # environment. Scheduled rather than commented out deliberately — this
  # project has twice shipped something that had to be switched on and was not
  # (Solid Queue itself until PR #41, the CI workflow for months), and an entry
  # someone forgets to restore fails exactly that way: silently, looking fine.
  voice_reminder_scheduler:
    class: VoiceReminderSchedulerJob
    queue: default
    schedule: every minute
