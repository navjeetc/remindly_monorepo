# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  
  prune_analytics:
    class: PruneAnalyticsJob
    queue: default
    schedule: every day at 3am

  # Every schedule in this file is UTC — config.time_zone is left at its default
  # in config/application.rb, so Time.zone is UTC in production. That is not
  # obvious when writing "8am", and it mattered here: this job emails a caregiver
  # to say nobody is scheduled to look after their parent on an upcoming day, and
  # at 8am UTC it arrived at 4am Eastern and 1am Pacific — buried under overnight
  # mail by the time anyone was awake to act on it.
  #
  # 12:00 UTC is 8am Eastern in summer and 7am in winter, which is what "8am" was
  # reaching for. A fixed UTC hour cannot be right for every recipient; if
  # caregivers ever span more timezones than they do now, the answer is to run
  # this hourly and mail each one at 8am in their own tz, which users already
  # carry on `tz`.
  check_coverage_gaps:
    class: CheckCoverageGapsJob
    queue: default
    schedule: "0 12 * * *"

  mark_missed_occurrences:
    class: MarkMissedOccurrencesJob
    queue: default
    schedule: every 15 minutes
