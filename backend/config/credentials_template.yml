# Production credentials template
# Run: EDITOR=nano bin/rails credentials:edit --environment production
# Then add these values:

postmark_api_token: YOUR_POSTMARK_API_TOKEN_HERE
# The canonical host, matching ApplicationHelper::CANONICAL_HOST. Email links
# and Telnyx webhook callbacks are both built from this.
base_url: www.remindly.care
admin_email: noreply@remindly.anakhsoft.com

# Telnyx Call Control (voice reminders)
# https://portal.telnyx.com/ -> Call Control -> Connections
telnyx:
  api_key: YOUR_TELNYX_API_KEY
  # Quote this. It is all digits, so an unquoted value decodes as an Integer
  # and Telnyx rejects the bare JSON number as an invalid connection_id.
  connection_id: 'YOUR_TELNYX_CONNECTION_ID'
  from_number: '+15551234567'
  webhook_token: a-long-random-token
  # Optional: Ed25519 public key from Telnyx portal for webhook signature verification.
  # When set, webhooks will be verified cryptographically instead of using the token.
  webhook_public_key: YOUR_TELNYX_WEBHOOK_PUBLIC_KEY

# Used as the base secret for all MessageVerifiers in Rails
secret_key_base: (already set - don't change)
