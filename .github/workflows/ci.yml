name: CI

# This file must live at the repository root. GitHub Actions only reads
# .github/workflows/ from the root, so the previous copy at
# backend/.github/workflows/ci.yml never ran — no PR in this repo has ever had a
# check. Keep it here even though the app lives in backend/.
on:
  pull_request:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    # Pinned, not ubuntu-latest: on 2026-10-24 ubuntu-latest became 26.04,
    # where setup-ruby builds only the newest patch of each Ruby series. CI
    # installs the exact version in backend/.ruby-version (what production
    # runs), so on ubuntu-latest every new 3.3.x patch release would break CI
    # until .ruby-version caught up -- that is what failed every job with
    # 3.3.5. A pinned image keeps the older patches; move it deliberately.
    runs-on: ubuntu-24.04

    env:
      RAILS_ENV: test
      # Read via ENV.fetch where JWTs are signed and verified (ApplicationController,
      # WebController, and the request specs). Those have a dev fallback, so this is
      # set to keep CI explicit rather than because a missing value would fail boot.
      JWT_SECRET: test_secret_for_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        run: bin/rails db:test:prepare

      # Covers the guard specs that enforce repo invariants — web_client_sync_spec
      # (clients/web vs backend/public/client drift) and public_assets_spec (no
      # docs or manifests served from public/) — alongside the app's own tests.
      - name: Run tests
        run: bundle exec rspec

  # The whole suite ran green while production could not boot at all.
  #
  # `config/initializers/postmark.rb` was wrapped in `if Rails.env.production?`,
  # so its contents ran in exactly one environment and no test could reach them.
  # It touched ActionMailer::Base during initialization, which constantized the
  # configured delivery_job before autoloading could resolve an app constant —
  # NameError, container exited 1, deploy refused to go healthy.
  #
  # Booting the production environment is the cheapest thing that would have
  # caught it. SECRET_KEY_BASE_DUMMY lets Rails boot without the master key, so
  # this needs no secrets: anything credentials-backed comes back nil, which is
  # fine, because what is being tested is that the app loads at all.
  boot_production:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Boot the production environment
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
          JWT_SECRET: boot_check_only
        # eager_load is on in production, so this loads every class in app/ and
        # runs every initializer — which is exactly where the failure was.
        run: bin/rails runner "puts 'production boot OK'"

  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: backend/.ruby-version
          bundler-cache: true
          working-directory: backend

      # The codebase was 604 offenses from clean until they were autocorrected.
      # Keeping this job green is the point: style drifts silently otherwise, the
      # same way the two web-client copies drifted while nothing compared them.
      - name: Lint code for consistent style
        run: bin/rubocop -f github
